<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Despesas Domésticas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> Minhas Despesas</h1>
            <p>Gerencie o orçamento da sua casa de forma simples</p>
        </header>

        <section class="dashboard">
            <div class="card income">
                <h3>Entradas</h3>
                <p id="total-income">R$ 0,00</p>
            </div>
            <div class="card expense">
                <h3>Saídas</h3>
                <p id="total-expense">R$ 0,00</p>
            </div>
            <div class="card balance">
                <h3>Saldo Total</h3>
                <p id="total-balance">R$ 0,00</p>
            </div>
        </section>

        <main>
            <section class="add-transaction">
                <h2>Nova Transação</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="desc">Descrição</label>
                        <input type="text" id="desc" placeholder="Ex: Conta de Luz" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Valor (R$)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Tipo</label>
                        <select id="type" required>
                            <option value="expense">Despesa (Saída)</option>
                            <option value="income">Receita (Entrada)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" required>
                            <option value="casa">Casa/Moradia</option>
                            <option value="alimentacao">Alimentação</option>
                            <option value="transporte">Transporte</option>
                            <option value="saude">Saúde</option>
                            <option value="lazer">Lazer</option>
                            <option value="salario">Salário/Renda</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn"><i class="fas fa-plus"></i> Adicionar</button>
                </form>
            </section>

            <section class="transaction-list">
                <h2>Histórico</h2>
                <ul id="list">
                    <!-- Transactions will be added here dynamically -->
                </ul>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
